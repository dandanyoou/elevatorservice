[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elevator-rl"
version = "0.1.0"
description = "RL-based multi-elevator scheduling: Gymnasium env, baselines, and PPO trainer."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "elevator-rl contributors" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gymnasium>=0.29",
    "loguru>=0.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
    "pre-commit>=3.7",
]
training = [
    "torch>=2.2",
    "stable-baselines3>=2.3",
    "mlflow>=2.14",
    "hydra-core>=1.3",
    "tensorboard>=2.16",
]
serving = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "websockets>=12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["envs*", "agents*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
plugins = []

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "gymnasium.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
